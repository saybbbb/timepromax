<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bezelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  
  <!-- Outer Cyan Ambient Ring Glow -->
  <circle cx="256" cy="256" r="190" stroke="url(#cyanGlow)" stroke-width="6" opacity="0.4" filter="url(#glow)"/>

  <!-- Watch Strap Upper Lug -->
  <path d="M196 90 L316 90 L306 140 L206 140 Z" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Watch Strap Lower Lug -->
  <path d="M206 372 L306 372 L316 422 L196 422 Z" fill="#1e293b" stroke="#334155" stroke-width="4"/>

  <!-- Watch Outer Casing & Crown -->
  <circle cx="256" cy="256" r="160" fill="url(#bezelGradient)" stroke="#475569" stroke-width="6"/>
  <!-- Digital Crown (Right Knob) -->
  <rect x="412" y="232" width="16" height="48" rx="6" fill="#38bdf8" opacity="0.9"/>

  <!-- Watch Bezel Inner Ring -->
  <circle cx="256" cy="256" r="142" stroke="url(#cyanGlow)" stroke-width="5" stroke-dasharray="4 6" opacity="0.8"/>

  <!-- Watch Dark Sapphire Dial -->
  <circle cx="256" cy="256" r="132" fill="#030712"/>

  <!-- Hour Markers -->
  <circle cx="256" cy="144" r="6" fill="#38bdf8"/>
  <circle cx="368" cy="256" r="6" fill="#38bdf8"/>
  <circle cx="256" cy="368" r="6" fill="#38bdf8"/>
  <circle cx="144" cy="256" r="6" fill="#38bdf8"/>

  <!-- Luxury Watch Hands (Positioned at 10:10 for elegance) -->
  <!-- Hour Hand pointing to 10 -->
  <line x1="256" y1="256" x2="190" y2="185" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Minute Hand pointing to 2 -->
  <line x1="256" y1="256" x2="335" y2="175" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <!-- Second Hand Pointer Accent -->
  <line x1="256" y1="256" x2="256" y2="340" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="256" cy="256" r="5" fill="#38bdf8"/>
</svg>